<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Waqt</title>
<meta name="description" content="Waqt: Adhan & Prayer Times, for iPhone and Android.">
<script>
  // One link for every phone: iPhone/iPad to the App Store, Android to Google Play, anything else sees both.
  var IOS = "https://apps.apple.com/sa/app/waqt-adhan-prayer-times/id6822675667";
  var PLAY = "https://play.google.com/store/apps/details?id=com.sihan.waqt";
  var ua = navigator.userAgent || "";
  var ipad = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
  if (/iPhone|iPad|iPod/i.test(ua) || ipad) location.replace(IOS);
  else if (/Android/i.test(ua)) location.replace(PLAY);
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #E9EBF0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: #141824; }
  main { background: #fff; border-radius: 30px; padding: 40px 32px; max-width: 360px; width: calc(100% - 32px); text-align: center; }
  h1 { margin: 0 0 6px; color: #1560F5; font-style: italic; font-size: 44px; }
  p { margin: 0 0 28px; color: #5b6273; }
  a { display: block; margin: 12px 0; padding: 16px; border-radius: 18px; background: #141824; color: #fff; text-decoration: none; font-weight: 600; }
  a.play { background: #1560F5; }
</style>
</head>
<body>
<main>
  <h1>Waqt</h1>
  <p>Prayer times, made beautiful.</p>
  <a href="https://apps.apple.com/sa/app/waqt-adhan-prayer-times/id6822675667">Download on the App Store</a>
  <a class="play" href="https://play.google.com/store/apps/details?id=com.sihan.waqt">Get it on Google Play</a>
</main>
</body>
</html>
